[package]
name = "ratatui-rain"
version = "1.1.1"
edition = "2021"
license = "MIT"
description = "Roughly maintained fork of tui-rain"
homepage = "https://github.com/mafien0/ratatui-rain"
repository = "https://github.com/mafien0/ratatui-rain"
readme = "README.md"
keywords = ["tui", "ratatui", "rain"]

[dependencies]
rand = { version = "0.10.2", default-features = false }
rand_pcg = "0.10.2"
ratatui = { version = "0.30.1", default-features = false }

[dev-dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
ratatui = "0.30.1"
tokio = { version = "1.41.1", features = ["full"] }
